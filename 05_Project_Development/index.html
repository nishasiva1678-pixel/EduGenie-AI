<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - AI Learning Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="header">

            <h1>🤖 EduGenie</h1>

            <p>
                Your AI-Powered Learning Assistant
            </p>

        </div>


        <div class="card">

            <label for="task">
                Choose what you want EduGenie to do
            </label>

            <select id="task">

                <option value="qna">
                    Ask a Question
                </option>

                <option value="explain">
                    Explain a Topic
                </option>

                <option value="quiz">
                    Generate Quiz
                </option>

                <option value="summary">
                    Summarize Text
                </option>

                <option value="learning">
                    Recommend Learning Path
                </option>

            </select>


            <label for="inputText">
                Enter your question or topic
            </label>

            <textarea
                id="inputText"
                placeholder="Example: Explain Artificial Intelligence for a beginner..."
            ></textarea>


            <button onclick="generateResult()">
                Generate
            </button>

        </div>


        <div class="result-card">

            <h2>AI Response</h2>

            <div id="result">
                Your result will appear here.
            </div>

        </div>

    </div>


    <script>

        async function generateResult() {

            const task =
                document.getElementById("task").value;

            const text =
                document.getElementById("inputText").value;

            const result =
                document.getElementById("result");


            if (!text.trim()) {

                result.innerText =
                    "Please enter something first.";

                return;
            }


            result.innerText =
                "⏳ EduGenie is thinking...";


            try {

                const response =
                    await fetch("/api/generate", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            task: task,
                            text: text

                        })

                    });


                const data =
                    await response.json();


                result.innerText =
                    data.result;

            }

            catch (error) {

                result.innerText =
                    "Something went wrong. Please try again.";

                console.error(error);

            }

        }

    </script>

</body>

</html>
